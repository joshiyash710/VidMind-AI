name: Keep Render app warm

# Render's free tier spins the service down after ~15 min of inactivity,
# causing a ~50s cold start on the next visit. This workflow pings the
# health endpoint on a schedule so the app stays awake.
#
# Notes:
#  - Schedule is UTC. */10 = every 10 minutes (margin under Render's 15-min sleep).
#  - GitHub may delay scheduled runs under load, and DISABLES scheduled
#    workflows after 60 days with no repo commits. If pings stop, push any
#    commit (or use UptimeRobot/cron-job.org instead for zero-maintenance).

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}   # lets you trigger a ping manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health (with cold-start allowance)
        run: |
          URL="https://vidmind-ai-1-dn9w.onrender.com/health"
          for i in 1 2 3 4; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "$URL" || echo "000")
            echo "Attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then
              echo "App is awake."
              exit 0
            fi
            sleep 20
          done
          echo "::warning::Health check did not return 200 (app may still be waking)."
